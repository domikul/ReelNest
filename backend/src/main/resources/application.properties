spring.application.name=reelnest-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reelnest_dev}
spring.datasource.username=${DATABASE_USERNAME:reelnest}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
reelnest.auth.username=${REELNEST_USERNAME:}
reelnest.auth.password=${REELNEST_PASSWORD:}
reelnest.cors.allowed-origins=${REELNEST_CORS_ALLOWED_ORIGINS:}
server.servlet.session.timeout=${REELNEST_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=REELNEST_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${REELNEST_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${REELNEST_COOKIE_SAME_SITE:strict}
server.servlet.session.tracking-modes=cookie
